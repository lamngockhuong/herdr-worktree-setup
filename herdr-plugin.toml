id = "lamngockhuong.worktree-setup"
name = "Worktree Setup"
version = "0.2.0"
min_herdr_version = "0.7.0"
description = "Prepare every new Herdr worktree: copy per-checkout config, link shared directories, run setup commands, and tear down again when it is removed"
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "init-config"
title = "Create .herdr-worktree.toml"
description = "Write a starter config into this repository, listing what the plugin detects today"
contexts = ["workspace"]
command = ["node", "src/init.mjs"]

[[actions]]
id = "dry-run"
title = "Preview worktree setup"
description = "Print what the plugin would copy, link, seed and run here, without doing any of it"
contexts = ["workspace"]
command = ["node", "src/preview.mjs"]

# The preview is rendered here rather than by the action: Herdr captures action
# output into the plugin log and shows it nowhere. `overlay` keeps the minimum
# Herdr version at 0.7.0; `popup` would raise it to 0.7.4.
[[panes]]
id = "preview"
title = "Worktree setup preview"
placement = "overlay"
command = ["node", "src/preview.mjs", "--pane"]

[[events]]
on = "worktree.created"
command = ["node", "src/index.mjs"]

[[events]]
on = "worktree.removed"
command = ["node", "src/remove.mjs"]
